name: kit

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://admin:admin@db:5432/workflowdb}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  ARTIFACT_ROOT: /artifacts
  SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-0.5}
  ARTIFACT_RETENTION: ${ARTIFACT_RETENTION:-3600}
  RETAIN_FAILED_ARTIFACTS: ${RETAIN_FAILED_ARTIFACTS:-true}
  BASE_URL_DLR_CONNECTOR: ${BASE_URL_DLR_CONNECTOR:-}
  API_KEY_DLR_CONNECTOR: ${API_KEY_DLR_CONNECTOR:-}
  BASE_URL_TS_CONNECTOR: ${BASE_URL_TS_CONNECTOR:-}
  API_KEY_TS_CONNECTOR: ${API_KEY_TS_CONNECTOR:-}


x-backend-base: &backend-base
  image: ghcr.io/rox-architecture/kit-backend:latest
  environment: *backend-environment
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - execution_artifacts:/artifacts
  restart: unless-stopped

services:
  api:
    <<: *backend-base
    container_name: kit-backend-api
    ports:
      - "${KIT_API_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *backend-base
    command:
      - sh
      - -c
      - >-
        celery -A cee.celery_app:celery_app worker
        --loglevel=INFO
        --concurrency=$${CELERY_WORKER_CONCURRENCY:-4}
    environment:
      <<: *backend-environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    volumes:
      - execution_artifacts:/artifacts
      - /var/run/docker.sock:/var/run/docker.sock

  db:
    image: postgres:16
    container_name: kit-backend-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflowdb}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    volumes:
      - workflow_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-workflowdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kit-backend-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  catalog:
    image: ghcr.io/rox-architecture/local-federated-catalog-dlr:latest
    container_name: local-fed-catalog-dlr
    environment:
      CONNECTOR_API_KEY: ${API_KEY_DLR_CONNECTOR}
      CONNECTOR_MANAGEMENT_API: ${BASE_URL_DLR_CONNECTOR}/cp/management
      PARTNER_MAPPING_PATH: /config/partner-mapping-dlr.json
    volumes:
      - ./config/partner-mapping-dlr.json:/config/partner-mapping-dlr.json:ro
    ports:
      - "${CATALOG_PORT:-8087}:8000"
    restart: unless-stopped

  frontend:
    image: ghcr.io/rox-architecture/kit-frontend:latest
    container_name: kit-frontend
    profiles: ["gui"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KIT_FRONTEND_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  workflow_pg_data:
  execution_artifacts: